[package]
name = "shiguredo_rtmp"
version = "2026.1.0-canary.4"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "RTMP library"
homepage = "https://github.com/shiguredo/rtmp-rs"
repository = "https://github.com/shiguredo/rtmp-rs"
readme = "README.md"

[features]
# これを有効にすると PBT / fuzzing で必要な構造体などが外部に公開されるようになる
pbt = []

[dependencies]

[workspace]
members = [
    "crates/c-api",
    "crates/wasm",
    "examples/publish",
    "examples/server",
    "pbt",
]
exclude = ["fuzz"]

# wasm リリース用のビルドプロファイル (サイズ最小化)
# cargo build --profile release-wasm --package wasm --target wasm32-unknown-unknown
[profile.release-wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
