[package]
name = "server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# コマンドライン引数のパースに使用する
noargs = "0.4"
# RTMPS (TLS) 配信に使用する
rustls = {
  version = "0.23",
  default-features = false,
  features = [
    "aws-lc-rs",
    "std",
    "tls12",
  ]
}
# RTMP サーバに使用するライブラリ本体
shiguredo_rtmp = { path = "../.." }
# 非同期 I/O とイベントループに使用する
tokio = {
  version = "1.52",
  features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
# rustls と tokio を橋渡しする TLS ストリームに使用する
tokio-rustls = "0.26"
